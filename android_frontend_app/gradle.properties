# AndroidX and Kotlin settings
android.useAndroidX=true
kotlin.code.style=official

# Gradle performance and compatibility
org.gradle.configureondemand=false
systemProp.org.gradle.unsafe.configuration-on-demand=false
org.gradle.jvmargs=-Xmx2g -Dkotlin.daemon.jvm.options=-Xmx1g
org.gradle.parallel=false

# Kotlin incremental compilation
kotlin.incremental=true
kotlin.build.report.enable=false
kotlin.build.report.http.reporter=false
kotlin.build.report.file.reporter=false
